name: Build AppImage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time for the shared 'continuous' release; a newer push
# cancels an in-flight build instead of racing it over the release assets.
concurrency:
  group: appimage-continuous
  cancel-in-progress: true

env:
  QT_VERSION: "6.9.1"
  # Lets every AppImage tool (linuxdeploy, its Qt plugin, appimagetool and
  # the smoke test) run without FUSE, which is unavailable in the container.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  appimage:
    runs-on: ubuntu-24.04
    # Build inside a 22.04 container (glibc 2.35) so the AppImage runs on
    # Ubuntu 22.04+/Debian 12+; bare ubuntu-22.04 runners are deprecated.
    container:
      image: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - name: Install build and packaging dependencies
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates file patchelf \
            python3 python3-pip python3-venv \
            libtag1-dev libgl1-mesa-dev \
            libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxrandr2 \
            libxcb1 libxcb-util1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-glx0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libgl1 libglx0 libopengl0 libegl1 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libasound2 libpulse0 \
            libfuse2
          # Qt 6.9 needs a newer CMake than Ubuntu 22.04 ships (3.22).
          python3 -m pip install --no-cache-dir --quiet "cmake>=3.28"
          # Container runs as root against a host-owned workspace.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v6

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # qtmultimedia (optional module) also ships Qt's own FFmpeg 7.1
          # libs and stub libs in $QTDIR/lib, which linuxdeploy bundles.
          modules: qtmultimedia qtshadertools
          # Container runs as root; there is no sudo to call.
          install-deps: nosudo
          cache: true

      - name: Build
        run: ./build.sh

      - name: Download AppImage tooling
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/tools"
          cd "$GITHUB_WORKSPACE/tools"
          curl -fsSL -O https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -O https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -O https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ./*.AppImage
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"

      - name: Package AppImage
        run: |
          set -eux
          # Resolve Qt's location from qmake instead of relying on a
          # particular env var name from the install action.
          QMAKE_BIN="$(command -v qmake || command -v qmake6 || true)"
          test -n "$QMAKE_BIN"
          QT_DIR="$(dirname "$(dirname "$QMAKE_BIN")")"
          export QMAKE="$QMAKE_BIN"
          # Non-standard Qt location: linuxdeploy needs this to resolve
          # libQt6* and Qt's bundled FFmpeg libs (libav*, stub libs).
          export LD_LIBRARY_PATH="$QT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Without this the AppImage would ship no media backend at all;
          # offscreen platform plugin is needed for the CI smoke test.
          export EXTRA_QT_PLUGINS="multimedia"
          export EXTRA_QT_MODULES="svg"
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"

          VERSION="$(sed -nE 's/^set\(PROJECT_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' CMakeLists.txt | paste -sd. -)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/appLaraRadio \
            --desktop-file deploy/linux/lararadio.desktop \
            --icon-file deploy/linux/lararadio.png \
            --plugin qt

          mkdir -p dist
          export ARCH=x86_64
          appimagetool-x86_64.AppImage AppDir "dist/LaraRadio-${VERSION}-x86_64.AppImage"

      - name: Smoke test the AppImage
        run: |
          set -eux
          # Exit 124 (timeout) means the app started and kept running;
          # anything else means a crash or a missing bundled library.
          set +e
          timeout 15 ./dist/LaraRadio-*-x86_64.AppImage -platform offscreen
          code=$?
          set -e
          echo "AppImage exit code: $code (expected 124)"
          test "$code" -eq 124

      - name: Remove the previous continuous pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          # Delete release and tag so both are recreated fresh at this
          # commit (404 = nothing to delete, which is fine).
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/continuous" || true
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/git/refs/tags/continuous" || true

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: LaraRadio — Continuous build
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Automated pre-release build of commit ${{ github.sha }}.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Runtime dependency:** `ffmpeg` must be installed on the system for
            album-art transcoding. Playback works without it; files with
            embedded cover art fall back to playing the original file.
          files: dist/*.AppImage
